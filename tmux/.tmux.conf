# IMPORTANT: These settings must come first for proper window numbering
# Start window and pane numbering from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Auto-name each window after its current directory (git repo / folder basename)
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
# Keep programs from overriding the name via terminal escape sequences
set -g allow-rename off

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -g allow-passthrough on
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g prefix C-b
bind-key C-b send-prefix
set -sg escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v
unbind r
bind r source-file ~/.tmux.conf
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z
bind S set-window-option synchronize-panes \; display-message "sync: #{?synchronize-panes,ON,OFF}"
bind > swap-pane -D
bind < swap-pane -U
bind f display-popup -E -w 60% -h 60% "sesh connect \"$(sesh list --icons | fzf --ansi --no-sort --prompt '⚡ ' --height 100%)\""
bind t display-popup -E -w 80% -h 80%
# popup launchers
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind y display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "yazi"
bind T command-prompt -I "#T" "select-pane -T '%%'"

# Layout presets. NOTE: prefix + 1..9 must stay on select-window — Ghostty's
# cmd+1..9 send `prefix N` — and prefix + Space is tmux-thumbs, so the layouts
# live on alt-digits (tmux's own default keys for them) plus `=` for a grid.
bind = select-layout tiled           \; display-message "layout: tiled (grid)"
bind M-1 select-layout even-horizontal \; display-message "layout: even-horizontal"
bind M-2 select-layout even-vertical   \; display-message "layout: even-vertical"
bind M-3 select-layout main-vertical   \; display-message "layout: main-vertical"
bind M-4 select-layout main-horizontal \; display-message "layout: main-horizontal"
bind M-5 select-layout tiled           \; display-message "layout: tiled (grid)"
# prefix+n stays next-window (Ghostty's cmd+shift+] sends it); restated
# explicitly because an `unbind n` removes it rather than restoring it.
bind n next-window

# Visual session/window/pane tree with previews
bind s choose-tree -Zs
bind w choose-tree -Zw
# Jump back to the previous pane, and give the pane numbers time to be read
bind \; last-pane
set -g display-panes-time 3000
bind / copy-mode \; send-keys /
bind , command-prompt -I "#W" "rename-window '%%'"
set -g mouse on
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
# Copy to system clipboard (macOS)
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
# Mouse selection also copies to system clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restarts
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions every 15 mins
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-cpu' # Added CPU monitoring plugin
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'alexwforsythe/tmux-which-key' # prefix + Space → command menu
set -g @plugin 'wfxr/tmux-fzf-url'  # prefix+u: open URLs from the pane in fzf

# Session save/restore settings
# Pane contents captured so restored panes come back with their scrollback.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
# Auto-save interval in minutes (raised from 15 to keep background saves calm).
set -g @continuum-save-interval '30'

# Create a hook to save session before detaching/exiting
set-hook -g client-detached "run-shell $HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh"

# Resurrect restores layout + cwd, but panes come back as empty shells: `claude`
# isn't restarted, and a fresh `claude` would start a NEW conversation anyway.
# Snapshot which conversation each pane was running alongside every save, so it
# can be resumed in place afterwards with `tmux-claude-sessions restore`.
# Restore is deliberately manual — it re-launches claude in many panes at once.
set -g @resurrect-hook-post-save-all 'tmux-claude-sessions save >/dev/null 2>&1 || true'

# Restored panes can come back taller than their window, which pushes the app's
# input line off screen and makes the pane look unresponsive. Re-fit them.
set -g @resurrect-hook-post-restore-all 'tmux-fix-pane-sizes >/dev/null 2>&1 || true'

# Status bar - Catppuccin Mocha theme
# Colors: FG=colour7 PINK=colour5 BLUE=colour4 TEAL=colour6
#         YELLOW=colour3 MAUVE=colour5 RED=colour1 OVERLAY=colour8 SURFACE=colour8

# Basic status bar settings
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=colour7"
set -g status-interval "2"

# Clean window status format - minimalist style
set -g window-status-style "fg=colour8,bg=default"
set -g window-status-current-style "fg=colour5,bg=default,bold"
set -g window-status-format ""
set -g window-status-current-format ""
set -g window-status-separator ""

# Left status with custom icons
set -g status-left-length "400"
set -g status-left "#{prefix_highlight}#[fg=colour5,bold]󱘖 #S #[fg=colour8] #(/opt/homebrew/bin/python3 $HOME/Dev/dotfiles/bin/tmux-window-gradient.py #{session_name})"

# Right status with custom icons
set -g @cpu_percentage_format "%3.0f%%"
set -g @ram_percentage_format "%3.0f%%"

set -g status-right-length 200
set -g status-right "#[fg=colour2]󰄪 #(sysctl -n vm.loadavg | awk '{print $2}') #[fg=colour8] #[fg=colour6]󰘚 #{cpu_percentage} #[fg=colour8] #[fg=colour3]󰍛 #{ram_percentage} #[fg=colour8] #[fg=colour5]󰋊 #(df -h / | awk 'NR==2{print $5}') #[fg=colour8] #[fg=colour4]󰁅 #(~/Dev/dotfiles/bin/tmux-net-speed.sh en1 rx) #[fg=colour8] #[fg=colour1]󰁝 #(~/Dev/dotfiles/bin/tmux-net-speed.sh en1 tx) #[fg=colour8] #[fg=colour5]󰔛 #(uptime | sed 's/.*up *//' | sed 's/,.*//') #[fg=colour8] #[fg=colour4]󰃰 %H:%M #[fg=colour8] #[fg=colour1]󰃭 %a %b %d "

# Message styling
set -g message-style "bg=colour5,fg=colour0,bold"

# Pane border styling with titles
set -g pane-border-status top
set -g pane-border-format " #[fg=colour4]#{pane_index}#[fg=colour8]: #[fg=colour7]#{pane_current_command} "
# Colourless pane borders, matching the window borders (JankyBorders): the
# active pane reads by contrast, not hue. colour5 was ANSI magenta, which
# catppuccin maps to Pink.
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour7"

# Monitor activity in other windows
set -g monitor-activity on
set -g visual-activity off
set -g activity-action other
set -g monitor-bell on
set -g bell-action other
set -g window-status-activity-style "fg=colour7"
set -g window-status-bell-style "fg=colour1,bold"

# Ghostty shimmer on activity/bell in other windows, clear on window switch
set-hook -g alert-activity[0] "run-shell -b '~/.claude/hooks/ghostty-shimmer.sh start'"
set-hook -g alert-bell[0] "run-shell -b '~/.claude/hooks/ghostty-shimmer.sh start'"
set-hook -g after-select-window[0] "run-shell -b '~/.claude/hooks/ghostty-shimmer.sh stop'"

# Dim inactive panes (fg inherits from terminal theme)
set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=default,bg=default'

# Popup styling
set -g popup-border-style "fg=colour8"
set -g popup-border-lines rounded

# Clock mode
set -g clock-mode-colour "colour4"
set -g clock-mode-style 24

# Customize prefix highlight
set -g @prefix_highlight_fg "colour0"
set -g @prefix_highlight_bg "colour1"
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr "fg=colour0,bg=colour4,bold"
set -g @prefix_highlight_prefix_prompt ' WAIT '
set -g @prefix_highlight_copy_prompt ' COPY '

# Initialize TPM (to be kept at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
