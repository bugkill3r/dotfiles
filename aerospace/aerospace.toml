# AeroSpace config — migrated from yabai + skhd
# Docs: https://nikitabobko.github.io/AeroSpace/guide
# Symlinked to ~/.aerospace.toml

config-version = 2

# Start AeroSpace at login (replaces the old yabai/skhd LaunchAgents)
start-at-login = true

# Auto-reload this file on save
auto-reload-config = true

# Layout defaults (bsp-like tiling, matching old yabai layout = bsp)
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Mouse follows focus across monitors (yabai had focus_follows_mouse autofocus)
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
focus-follows-mouse.enabled = false

automatically-unhide-macos-hidden-apps = false

# Gaps — carried over from yabai window_gap = 4 / padding = 4
gaps.inner.horizontal = 4
gaps.inner.vertical   = 4
gaps.outer.left       = 4
gaps.outer.bottom     = 4
gaps.outer.top        = 4
gaps.outer.right      = 4

# Keep the dedicated app workspaces alive even when empty
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

key-mapping.preset = 'qwerty'

# ─────────────────────────────────────────────────────────────
# Monitor assignment — Chrome's workspace (3) lives on the external
# monitor when one is connected; falls back to built-in when it's the
# only display. Assumes built-in stays the macOS primary/main display.
# If you make the external your primary instead, change 'secondary' to
# a name match like '^lg' (case-insensitive substring regex).
# ─────────────────────────────────────────────────────────────
[workspace-to-monitor-force-assignment]
3 = 'secondary'

# ─────────────────────────────────────────────────────────────
# Dedicated spaces — apps auto-move to their workspace on launch
#   1: Cursor   2: Obsidian   3: Chrome   4: Ghostty
#   5: Claude   6: Safari     7: zoom
# ─────────────────────────────────────────────────────────────
[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'  # Cursor
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = 'move-node-to-workspace 7'

# Float system/settings dialogs (mirrors old yabai manage=off rules)
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

# ─────────────────────────────────────────────────────────────
# Main bindings — alt is the modifier, same as old skhd
# ─────────────────────────────────────────────────────────────
[mode.main.binding]

# Open terminal (Ghostty) — i3-style alt-enter
alt-enter = 'exec-and-forget open -a Ghostty'

# Layout toggles (skhd alt-e/alt-s equivalents)
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Change focus — alt + hjkl (skhd: window --focus)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-left  = 'focus left'
alt-down  = 'focus down'
alt-up    = 'focus up'
alt-right = 'focus right'

# Move window — alt + shift + hjkl (skhd: window --swap)
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'
alt-shift-left  = 'move left'
alt-shift-down  = 'move down'
alt-shift-up    = 'move up'
alt-shift-right = 'move right'

# Resize (skhd had none; sensible defaults)
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'
alt-shift-0 = 'balance-sizes'   # skhd alt-shift-0 = space --balance

# Window ops (skhd: alt-w close, alt-f zoom, alt-shift-f native fullscreen)
alt-w = 'close'
alt-f = 'fullscreen'
alt-shift-f = 'macos-native-fullscreen'

# Focus workspaces 1-9 (skhd used spaces via alt+shift only; adds alt+N to jump)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move focused window to workspace N (skhd: window --space N)
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Back-and-forth between last two workspaces (skhd alt-b = space --focus recent)
alt-tab = 'workspace-back-and-forth'
alt-b   = 'workspace-back-and-forth'

# Move whole workspace to the next monitor
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Enter service mode for less-frequent ops
alt-shift-semicolon = 'mode service'

# ─────────────────────────────────────────────────────────────
# Service mode — reset/join/close (esc returns to main)
# ─────────────────────────────────────────────────────────────
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']   # reset layout
f = ['layout floating tiling', 'mode main']   # toggle float/tile
backspace = ['close-all-windows-but-current', 'mode main']

# Join a window into a container (skhd alt+ctrl-hjkl insertion-point analog)
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
